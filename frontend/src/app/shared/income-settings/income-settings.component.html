<div class="modal-overlay" (click)="onClose()">
  <div class="modal-shell" (click)="$event.stopPropagation()">
    <header class="modal-header">
      <div>
        <h2 class="modal-title">Nuevo Ingreso</h2>
        <span class="modal-subtitle">Registra tu ingreso fijo y variable actualizando tu balance en tiempo real</span>
      </div>
      <button class="modal-close" (click)="onClose()" title="Cerrar">
        <span>×</span>
      </button>
    </header>

    <div class="modal-body">
      <!-- Ingreso Fijo -->
      <div class="settings-block">
        <label class="block-label" for="fixedIncome">Ingreso Fijo</label>
        <div class="input-group">
          <span class="input-prefix">Q</span>
          <input
            id="fixedIncome"
            type="number"
            class="money-input"
            [(ngModel)]="income.fixedIncome"
            name="fixedIncome"
            min="0"
            step="100"
          />
        </div>
      </div>

      <!-- Ingreso Variable -->
      <div class="settings-block">
        <span class="block-label">Ingreso Variable</span>

        <div class="variable-grid">
          <div class="field">
            <label class="field-label" for="variableHours">Horas trabajadas</label>
            <input
              id="variableHours"
              type="number"
              class="money-input"
              [(ngModel)]="income.variableHours"
              name="variableHours"
              min="0"
              step="1"
            />
          </div>
          <div class="field">
            <label class="field-label" for="variableRate">Precio por hora</label>
            <div class="input-group">
              <span class="input-prefix">Q</span>
              <input
                id="variableRate"
                type="number"
                class="money-input"
                [(ngModel)]="income.variableRate"
                name="variableRate"
                min="0"
                step="10"
              />
            </div>
          </div>
        </div>

        <!-- Cálculo automático del subtotal variable -->
        <div class="auto-calc">
          <span class="tag-auto">Cálculo Automático</span>
          <div class="calc-value">
            <span class="calc-label">Total de Ingreso Variable</span>
            <strong>{{ income.formatMoney(income.variableSubtotal) }}</strong>
          </div>
        </div>
      </div>

      <!-- Ingreso Mensual Total -->
      <div class="total-row">
        <span>Ingreso Mensual Total</span>
        <strong>{{ income.formatMoney(income.monthlyTotal) }}</strong>
      </div>

      <!-- Comentario opcional -->
      <div class="settings-block">
        <label class="block-label" for="incomeNote">Comentario (opcional)</label>
        <input
          id="incomeNote"
          type="text"
          class="text-input"
          [(ngModel)]="income.incomeNote"
          name="incomeNote"
          placeholder="Ej: Pago quincenal, Horas extra proyecto X..."
        />
      </div>

      <!-- Acción de registro -->
      <button class="submit-btn" (click)="onSubmit()">
        + Registrar Ingreso
      </button>
    </div>
  </div>
</div>
